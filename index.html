

<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komax BT752-722 — Pretraga delova</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }

.header { background: #003057; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.header-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; }
.logo { display: flex; align-items: baseline; }
.logo-k { font-size: 30px; font-weight: 900; color: #e4002b; line-height: 1; }
.logo-rest { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 2px; line-height: 1; }
.machine-tag { background: rgba(228,0,43,0.18); border: 1px solid rgba(228,0,43,0.45); color: #ff7090; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.5px; margin-left: 14px; }
.header-right { display: flex; align-items: center; gap: 14px; }
.header-subtitle { color: rgba(255,255,255,0.55); font-size: 12px; }
.admin-btn { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); font-size: 12px; padding: 5px 14px; border-radius: 5px; cursor: pointer; transition: all 0.2s; }
.admin-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

.search-section { background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.07); padding: 14px 28px; display: flex; gap: 10px; align-items: center; }
.input-wrap { flex: 1; position: relative; }
.input-wrap input { width: 100%; border: none; border-radius: 6px; padding: 10px 14px 10px 40px; font-size: 14px; color: #1a1a2e; background: #fff; outline: none; }
.input-wrap input::placeholder { color: #aaa; }
.input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 16px; }
.area-select { background: #fff; border: none; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #1a1a2e; outline: none; cursor: pointer; min-width: 180px; }
.search-btn { background: #e4002b; color: #fff; border: none; border-radius: 6px; padding: 10px 22px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
.search-btn:hover { background: #c0001f; }

.content { padding: 22px 28px; }
.results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 13px; color: #555; }
.results-pill { background: #003057; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

.card { background: #fff; border-radius: 10px; border: 1px solid #e2e6ec; overflow: hidden; transition: transform 0.15s, box-shadow 0.2s; cursor: pointer; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,48,87,0.13); }
.card-img { width: 100%; height: 150px; background: #f2f5f8; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
.no-img { font-size: 44px; color: #c8d4de; }
.card-body { padding: 11px 13px 13px; }
.card-partnum { font-size: 15px; font-weight: 800; color: #003057; margin-bottom: 5px; letter-spacing: 0.3px; }
.card-desc { font-size: 12px; color: #555; margin-bottom: 8px; line-height: 1.35; }
.card-area { display: inline-block; background: #e8eef5; color: #003057; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; letter-spacing: 0.3px; margin-bottom: 10px; }
.card-actions { display: flex; gap: 7px; }
.btn-pdf { display: flex; align-items: center; gap: 4px; background: #e4002b; color: #fff; border: none; border-radius: 5px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background 0.15s; }
.btn-pdf:hover { background: #c0001f; }
.btn-pdf.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.btn-detail { display: flex; align-items: center; gap: 4px; background: #f0f4f8; color: #003057; border: 1px solid #ccd8e5; border-radius: 5px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.btn-detail:hover { background: #dce8f0; }

.state-box { background: #fff; border-radius: 10px; border: 1px solid #e2e6ec; padding: 60px 24px; text-align: center; }
.state-box .big-icon { font-size: 52px; display: block; margin-bottom: 14px; }
.state-box p { font-size: 14px; color: #888; }
.state-box strong { color: #003057; }
.loading-wrap { display: flex; align-items: center; gap: 12px; padding: 28px 0; color: #003057; font-size: 14px; }
.spinner { width: 22px; height: 22px; border: 3px solid #d0dce8; border-top-color: #003057; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: #fff5f6; border: 1px solid #f5bfc5; border-radius: 8px; padding: 14px 18px; color: #a0001a; font-size: 13px; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 26px; position: relative; }
.modal-close { position: absolute; top: 14px; right: 14px; background: #f0f2f6; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; color: #555; }
.modal-img-wrap { width: 100%; height: 200px; background: #f2f5f8; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; overflow: hidden; }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
.modal-title { font-size: 17px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.modal-field { background: #f5f7fa; border-radius: 8px; padding: 11px 14px; }
.modal-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: #888; margin-bottom: 4px; }
.modal-val { font-size: 14px; font-weight: 700; color: #003057; }
.modal-actions { display: flex; gap: 10px; }

.admin-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
.admin-panel.open { display: flex; }
.admin-box { background: #fff; border-radius: 14px; width: 100%; max-width: 580px; max-height: 92vh; overflow-y: auto; padding: 28px; position: relative; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid #003057; }
.admin-header h2 { font-size: 17px; color: #003057; font-weight: 700; }
.login-box { background: #fff; border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 360px; text-align: center; }
.login-box h3 { font-size: 18px; color: #003057; margin-bottom: 20px; font-weight: 700; }
.login-box input { width: 100%; border: 1px solid #d5dce5; border-radius: 6px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #003057; }
.btn-login { background: #003057; color: #fff; border: none; border-radius: 7px; padding: 10px 0; font-size: 14px; font-weight: 700; width: 100%; cursor: pointer; }
.btn-login:hover { background: #00487a; }
.login-err { color: #c62828; font-size: 13px; margin-top: 8px; display: none; }
.form-row { margin-bottom: 13px; }
.form-row label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-row input { width: 100%; border: 1px solid #d5dce5; border-radius: 6px; padding: 9px 12px; font-size: 13px; color: #1a1a2e; outline: none; }
.form-row input:focus { border-color: #003057; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-save { background: #003057; color: #fff; border: none; border-radius: 7px; padding: 11px 24px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; transition: background 0.15s; }
.btn-save:hover { background: #00487a; }
.admin-msg { margin-top: 10px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
.admin-msg.ok { background: #e8f5e9; color: #2e7d32; display: block; }
.admin-msg.err { background: #ffebee; color: #c62828; display: block; }
.saved-section { margin-top: 24px; border-top: 1px solid #eee; padding-top: 18px; }
.saved-section h3 { font-size: 14px; font-weight: 700; color: #003057; margin-bottom: 12px; }
.saved-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f5f7fa; border-radius: 6px; margin-bottom: 6px; font-size: 13px; color: #333; }
.btn-del { background: none; border: none; color: #e4002b; cursor: pointer; font-size: 16px; font-weight: 700; padding: 0 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div style="display:flex;align-items:center;">
      <div class="logo"><span class="logo-k">K</span><span class="logo-rest">OMAX</span></div>
      <span class="machine-tag">BT 752-722</span>
    </div>
    <div class="header-right">
      <div class="header-subtitle">Pretraga rezervnih delova</div>
      <button class="admin-btn" onclick="openAdmin()">⚙ Admin</button>
    </div>
  </div>
  <div class="search-section">
    <div class="input-wrap">
      <span class="input-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Unesite Part broj..." onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <select class="area-select" id="areaSelect">
      <option value="">AREA</option>
    </select>
    <button class="search-btn" onclick="doSearch()">Pretraži</button>
  </div>
</div>

<div class="content">
  <div id="resultsBar" class="results-bar" style="display:none;">
    <span id="resultsLabel">Rezultati</span>
    <span class="results-pill" id="resultsCount">0</span>
  </div>
  <div id="mainArea">
    <div class="state-box">
      <span class="big-icon">🔧</span>
      <p>Unesite <strong>Part broj</strong> ili odaberite <strong>Area</strong> iz padajućeg menija.</p>
    </div>
  </div>
</div>

<div class="modal-bg" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div class="modal-img-wrap" id="mImg"></div>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-grid" id="mFields"></div>
    <div class="modal-actions" id="mActions"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel" onclick="if(event.target===this)closeAdmin()">
  <div id="adminInner">
    <div class="login-box" id="loginBox">
      <h3>🔐 Admin pristup</h3>
      <input type="password" id="adminPass" placeholder="Lozinka..." onkeydown="if(event.key==='Enter')checkLogin()">
      <button class="btn-login" onclick="checkLogin()">Prijavi se</button>
      <div class="login-err" id="loginErr">Pogrešna lozinka!</div>
    </div>
    <div class="admin-box" id="adminForm" style="display:none;">
      <div class="admin-header">
        <h2>⚙ Admin — Dodaj deo</h2>
        <button class="modal-close" onclick="closeAdmin()">✕</button>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>Part broj *</label><input type="text" id="fPartNum" placeholder="npr. 10022334"></div>
        <div class="form-row"><label>R-broj</label><input type="text" id="fRNum" placeholder="npr. R-1042"></div>
      </div>
      <div class="form-row"><label>Opis dela *</label><input type="text" id="fDesc" placeholder="Naziv i opis dela"></div>
      <div class="form-2col">
        <div class="form-row"><label>Area (oblast)</label><input type="text" id="fArea" placeholder="npr. CRIMPING"></div>
        <div class="form-row"><label>Lokacija</label><input type="text" id="fLoc" placeholder="npr. A-03-02"></div>
      </div>
      <div class="form-row"><label>URL slike</label><input type="text" id="fImg" placeholder="https://raw.githubusercontent.com/..."></div>
      <div class="form-row"><label>URL PDF-a</label><input type="text" id="fPdf" placeholder="https://raw.githubusercontent.com/..."></div>
      <button class="btn-save" onclick="savePart()">💾 Sačuvaj deo</button>
      <div class="admin-msg" id="adminMsg"></div>
      <div class="saved-section">
        <h3>Sačuvani delovi</h3>
        <div id="savedList">Učitavanje...</div>
      </div>
    </div>
  </div>
</div>

<script>
const BIN_ID = "69fde64badc21f119a6fe87d";
const API_KEY = "2a$10$vGksn.m1pXrr6ODqKiVeXuL5j0R3HwonCvVNR8tE0NEy8RHlCxjn.";
const ADMIN_PASS = "jazakikomaks257";
const API_BASE = "https://api.jsonbin.io/v3/b/" + BIN_ID;

async function loadParts() {
  const res = await fetch(API_BASE + "/latest", { headers: { "X-Master-Key": API_KEY } });
  const json = await res.json();
  const rec = json.record;
  return Array.isArray(rec) ? rec : (Array.isArray(rec.parts) ? rec.parts : []);
}

async function saveParts(parts) {
  await fetch(API_BASE, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
    body: JSON.stringify(parts)
  });
}

async function populateAreas() {
  try {
    const parts = await loadParts();
    const areas = [...new Set(parts.map(p => (p.area || "").trim().toUpperCase()).filter(Boolean))].sort();
    const sel = document.getElementById("areaSelect");
    sel.innerHTML = `<option value="">AREA</option>` + areas.map(a => `<option value="${a}">${a}</option>`).join("");
  } catch(e) {}
}

populateAreas();

async function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const area = document.getElementById("areaSelect").value;
  const main = document.getElementById("mainArea");
  const bar = document.getElementById("resultsBar");

  if (!q && !area) {
    main.innerHTML = `<div class="state-box"><span class="big-icon">🔧</span><p>Unesite <strong>Part broj</strong> ili odaberite <strong>Area</strong> iz padajućeg menija.</p></div>`;
    bar.style.display = "none";
    return;
  }

  main.innerHTML = `<div class="loading-wrap"><div class="spinner"></div> Pretraga u toku...</div>`;
  bar.style.display = "none";

  try {
    const parts = await loadParts();
    let results;

    if (q && !area) {
      // Samo part broj — prikazuje sve bez obzira na area
      results = parts.filter(p => String(p.partNumber || "").toLowerCase().includes(q));
    } else if (!q && area) {
      // Samo area — lista svih delova iz te oblasti
      results = parts.filter(p => (p.area || "").toUpperCase() === area);
    } else {
      // Oboje — precizna kombinovana pretraga
      results = parts.filter(p =>
        String(p.partNumber || "").toLowerCase().includes(q) &&
        (p.area || "").toUpperCase() === area
      );
    }

    bar.style.display = "flex";
    document.getElementById("resultsCount").textContent = results.length;
    document.getElementById("resultsLabel").textContent = results.length > 0
      ? `Pronađeno ${results.length} rezultata` : "Nema rezultata";

    if (results.length === 0) {
      main.innerHTML = `<div class="state-box"><span class="big-icon">🔍</span><p>Nema rezultata. Proverite Part broj ili odaberite drugu oblast.</p></div>`;
      return;
    }

    main.innerHTML = `<div class="grid">${results.map(renderCard).join("")}</div>`;
  } catch(e) {
    bar.style.display = "none";
    main.innerHTML = `<div class="error-msg">❌ Greška pri učitavanju: ${e.message}</div>`;
  }
}

function renderCard(p) {
  const pn = p.partNumber || "—";
  const desc = p.description || "—";
  const rNum = p.rNumber || "—";
  const loc = p.location || "—";
  const area = p.area || "—";
  const imgUrl = p.image || "";
  const pdfUrl = p.pdf || "";
  const d = encodeURIComponent(JSON.stringify({pn,desc,rNum,loc,area,imgUrl,pdfUrl}));

  return `
  <div class="card" onclick="openDetail('${d}')">
    <div class="card-img">
      ${imgUrl ? `<img src="${imgUrl}" alt="${pn}" onerror="this.style.display='none';this.nextSibling.style.display='block'"><div class="no-img" style="display:none">🔧</div>` : `<div class="no-img">🔧</div>`}
    </div>
    <div class="card-body">
      <div class="card-partnum">${pn}</div>
      <div class="card-desc">${desc}</div>
      <div class="card-area">${area}</div>
      <div class="card-actions">
        ${pdfUrl ? `<a class="btn-pdf" href="${pdfUrl}" target="_blank" onclick="event.stopPropagation()">📄 PDF</a>` : `<span class="btn-pdf disabled">📄 PDF</span>`}
        <button class="btn-detail" onclick="event.stopPropagation();openDetail('${d}')">🔎 Detalji</button>
      </div>
    </div>
  </div>`;
}

function openDetail(encoded) {
  const p = JSON.parse(decodeURIComponent(encoded));
  document.getElementById("mImg").innerHTML = p.imgUrl
    ? `<img src="${p.imgUrl}" alt="${p.pn}">` : `<div style="font-size:56px;color:#c8d4de">🔧</div>`;
  document.getElementById("mTitle").textContent = p.desc;
  document.getElementById("mFields").innerHTML = `
    <div class="modal-field"><div class="modal-label">Part Number</div><div class="modal-val">${p.pn}</div></div>
    <div class="modal-field"><div class="modal-label">R-Broj</div><div class="modal-val">${p.rNum}</div></div>
    <div class="modal-field"><div class="modal-label">Area</div><div class="modal-val">${p.area}</div></div>
    <div class="modal-field"><div class="modal-label">Lokacija</div><div class="modal-val">${p.loc}</div></div>`;
  document.getElementById("mActions").innerHTML = p.pdfUrl
    ? `<a class="btn-pdf" href="${p.pdfUrl}" target="_blank">📄 Otvori PDF</a>` : "";
  document.getElementById("detailModal").classList.add("open");
}
function closeDetail() { document.getElementById("detailModal").classList.remove("open"); }

function openAdmin() {
  document.getElementById("adminPanel").classList.add("open");
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("adminForm").style.display = "none";
  document.getElementById("adminPass").value = "";
  document.getElementById("loginErr").style.display = "none";
}
function closeAdmin() { document.getElementById("adminPanel").classList.remove("open"); }

function checkLogin() {
  if (document.getElementById("adminPass").value === ADMIN_PASS) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminForm").style.display = "block";
    loadSavedList();
  } else {
    document.getElementById("loginErr").style.display = "block";
  }
}

async function loadSavedList() {
  const list = document.getElementById("savedList");
  list.innerHTML = "Učitavanje...";
  try {
    const parts = await loadParts();
    if (parts.length === 0) { list.innerHTML = "<p style='font-size:13px;color:#888'>Nema unetih delova.</p>"; return; }
    list.innerHTML = parts.map((p,i) => `
      <div class="saved-item">
        <span><strong>${p.partNumber}</strong> — ${p.description} <span style="color:#003057;font-size:11px;">[${p.area||""}]</span></span>
        <button class="btn-del" onclick="deletePart(${i})">✕</button>
      </div>`).join("");
  } catch(e) {
    list.innerHTML = `<p style='color:#c62828;font-size:13px'>Greška: ${e.message}</p>`;
  }
}

async function savePart() {
  const pn = document.getElementById("fPartNum").value.trim();
  const desc = document.getElementById("fDesc").value.trim();
  const msg = document.getElementById("adminMsg");
  if (!pn || !desc) { msg.className = "admin-msg err"; msg.textContent = "Part broj i opis su obavezni!"; return; }
  msg.className = "admin-msg"; msg.textContent = "Čuvanje..."; msg.style.display = "block";
  try {
    const parts = await loadParts();
    parts.push({
      partNumber: pn, description: desc,
      rNumber: document.getElementById("fRNum").value.trim(),
      area: document.getElementById("fArea").value.trim().toUpperCase(),
      location: document.getElementById("fLoc").value.trim(),
      image: document.getElementById("fImg").value.trim(),
      pdf: document.getElementById("fPdf").value.trim()
    });
    await saveParts(parts);
    msg.className = "admin-msg ok"; msg.textContent = "✓ Deo uspešno sačuvan!";
    ["fPartNum","fRNum","fDesc","fArea","fLoc","fImg","fPdf"].forEach(id => document.getElementById(id).value = "");
    loadSavedList();
    populateAreas();
  } catch(e) { msg.className = "admin-msg err"; msg.textContent = "Greška: " + e.message; }
}

async function deletePart(index) {
  if (!confirm("Obrisati ovaj deo?")) return;
  try {
    const parts = await loadParts();
    parts.splice(index, 1);
    await saveParts(parts);
    loadSavedList();
    populateAreas();
  } catch(e) { alert("Greška pri brisanju: " + e.message); }
}
</script>
</body>
</html>
